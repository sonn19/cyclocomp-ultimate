name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'pubspec.yaml'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Install Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name cyclocomp_ultimate .
      - name: Remove generated demo test referring to MyApp
        run: rm -f test/widget_test.dart
      - name: Grant Android GPS permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/src/main/AndroidManifest.xml')
          s=p.read_text()
          marker='<application'
          permissions=[
            'android.permission.ACCESS_FINE_LOCATION',
            'android.permission.ACCESS_COARSE_LOCATION',
            'android.permission.FOREGROUND_SERVICE',
            'android.permission.FOREGROUND_SERVICE_LOCATION',
            'android.permission.WAKE_LOCK',
            'android.permission.INTERNET',
            'android.permission.BLUETOOTH',
            'android.permission.BLUETOOTH_ADMIN',
            'android.permission.BLUETOOTH_SCAN',
            'android.permission.BLUETOOTH_CONNECT',
          ]
          perms=''.join('    <uses-permission android:name="'+name+'" />'+chr(10) for name in permissions)
          assert marker in s
          s=s.replace(marker,perms+marker,1)
          p.write_text(s)
          PY
      - name: Fetch packages
        run: flutter pub get
      - name: Install Android SDK API 36
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" || true
      - name: Align Android plugin compile SDK with API 36
        run: |
          python3 - <<'PY'
          from pathlib import Path
          app=Path('android/app/build.gradle.kts')
          if app.exists():
              src=app.read_text()
              src=src.replace('compileSdk = flutter.compileSdkVersion','compileSdk = 36')
              app.write_text(src)
          else:
              app=Path('android/app/build.gradle')
              src=app.read_text()
              src=src.replace('compileSdkVersion flutter.compileSdkVersion','compileSdkVersion 36')
              src=src.replace('compileSdk flutter.compileSdkVersion','compileSdk 36')
              app.write_text(src)
          found=list(Path.home().glob('.pub-cache/hosted/pub.dev/file_picker-*/android/build.gradle'))
          if not found:
              raise SystemExit('file_picker Android Gradle config not found')
          for plugin in found:
              src=plugin.read_text()
              updated=src.replace('compileSdkVersion 34','compileSdkVersion 36').replace('compileSdk 34','compileSdk 36').replace('compileSdk = 34','compileSdk = 36')
              if updated == src:
                  raise SystemExit(f'Expected compileSdk 34 in {plugin}')
              plugin.write_text(updated)
              print(f'Updated {plugin}')
          PY
      - name: Analyze Dart
        run: flutter analyze --no-fatal-infos
      - name: Build installable debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CycloComp-Ultimate-Android-APK
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 30
      - name: Prepare direct-download APK
        run: cp build/app/outputs/flutter-apk/app-debug.apk CycloComp-Ultimate.apk
      - name: Publish direct APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-preview-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" CycloComp-Ultimate.apk --target "$GITHUB_SHA" --title "CycloComp Ultimate - Preview ${GITHUB_RUN_NUMBER}" --notes "APK debug pengujian GPS, peta, auto-pause, GPX, BLE dan Bike Garage. Strava belum aktif." --prerelease
